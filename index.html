<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070b"><title>Phonix Arcade</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#f7f8fb;background:#05070b;--panel:#10141d;--line:#ffffff16;--muted:#8c96a8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#172448,#05070b 45%);min-height:100vh}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:28px 18px 110px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px}.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#1683ff,#6658e8);font-size:22px}.muted{color:var(--muted)}h1{font-size:clamp(42px,8vw,82px);line-height:.96;letter-spacing:-.055em;margin:58px 0 18px}.hero{max-width:760px}.chips{display:flex;gap:8px;overflow:auto;padding:5px 0 12px}.chip,.btn{border:1px solid var(--line);background:#ffffff09;color:#fff;border-radius:999px;padding:10px 15px;cursor:pointer}.chip.active{background:#fff;color:#05070b}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:20px}.card{overflow:hidden;border:1px solid var(--line);border-radius:24px;background:var(--panel)}.cover{height:145px;padding:16px;display:flex;align-items:end}.cardbody{padding:16px}.tag{display:inline-block;font-size:11px;color:#b7c2d8;background:#ffffff0c;padding:5px 8px;border-radius:999px;margin:2px}.play{width:100%;margin-top:14px;border:0;border-radius:15px;background:#fff;color:#07090d;padding:12px;font-weight:700;cursor:pointer}.empty{padding:30px;border:1px dashed var(--line);border-radius:20px;color:var(--muted)}.modal{position:fixed;inset:0;background:#000c;backdrop-filter:blur(15px);z-index:20;display:grid;place-items:center;padding:14px}.panel{width:min(900px,100%);max-height:94vh;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:#0c1018;box-shadow:0 30px 100px #000}.head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.close{border:0;background:#ffffff0a;color:#fff;width:38px;height:38px;border-radius:50%;cursor:pointer}.lobby{padding:22px}.code{font-size:clamp(40px,10vw,70px);font-weight:800;letter-spacing:.16em;margin:12px 0}.field{width:100%;background:#05070b;color:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;outline:0}.row{display:flex;gap:8px}.gameframe{width:100%;height:min(78vh,760px);border:0;background:#05070b}.bottom{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);padding:8px;border:1px solid var(--line);background:#11151ddd;backdrop-filter:blur(20px);border-radius:24px;display:flex;gap:6px}.bottom button{border:0;background:transparent;color:#fff;border-radius:16px;padding:12px 18px;cursor:pointer}.hidden{display:none!important}@media(max-width:600px){.wrap{padding-left:14px;padding-right:14px}.modal{align-items:end;padding:0}.panel{border-radius:24px 24px 0 0}.gameframe{height:82vh}.row{flex-direction:column}}
</style></head>
<body>
<div class="wrap"><header class="top"><div class="brand"><div class="logo">P</div><div><b>Phonix Arcade</b><div class="muted" style="font-size:12px">Games loaded from games.json</div></div></div><button id="refresh" class="btn">Refresh</button></header><section class="hero"><h1>Play together.<br>No game server.</h1><p class="muted">The catalog is data-driven. Add a game to <code>games.json</code>, point <code>entryUrl</code> at its HTML page, and it appears here automatically.</p></section><div id="chips" class="chips"></div><div id="games" class="grid"></div></div>
<nav class="bottom"><button data-filter="all">All</button><button data-filter="1v1">1v1</button><button data-filter="party">Party</button><button data-filter="coop">Co-op</button><button data-filter="story">Story</button></nav>
<div id="lobby" class="modal hidden" role="dialog" aria-modal="true"><div class="panel"><div class="head"><div><b id="lobbyTitle">Match</b><div class="muted" style="font-size:12px">Create or join a room</div></div><button class="close" data-close="lobby">×</button></div><div class="lobby"><div class="muted">Room code</div><div id="roomCode" class="code">------</div><div class="row"><input id="roomLink" class="field" readonly><button id="copy" class="btn">Copy</button></div><button id="launch" class="play">Launch game</button><p id="roomStatus" class="muted"></p></div></div></div>
<div id="game" class="modal hidden" role="dialog" aria-modal="true"><div class="panel"><div class="head"><b id="gameTitle">Game</b><button class="close" data-close="game">×</button></div><iframe id="frame" class="gameframe" title="Phonix game" allow="autoplay"></iframe></div></div>
<script>
const FALLBACK=[{id:'neon-duel',title:'Neon Duel',category:'1v1',tags:['duel','pvp','arcade'],theme:'linear-gradient(135deg,#0a84ff,#5e5ce6)',entryType:'demo',entryUrl:'',status:'enabled'}];let games=[],filter='all',selected=null;const $=s=>document.querySelector(s),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{const r=await fetch(`games.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error();const d=await r.json();if(!Array.isArray(d))throw Error();games=d}catch(e){games=[]}render()}
function render(){const cats=[['all','All Games'],['1v1','1v1'],['party','Party'],['coop','Co-op'],['story','Story']];$('#chips').innerHTML=cats.map(([id,n])=>`<button class="chip ${filter===id?'active':''}" data-filter="${id}">${n}</button>`).join('');const v=games.filter(g=>g.status!=='disabled'&&(filter==='all'||g.category===filter));$('#games').innerHTML=v.length?v.map(g=>`<article class="card"><div class="cover" style="background:${safe(g.theme||'#171b25')}"><div><span class="tag">${safe(g.category||'game')}</span>${g.multiplayer?'<span class="tag">2-player</span>':''}<h2 style="margin:9px 0 0">${safe(g.title)}</h2></div></div><div class="cardbody"><div>${(g.tags||[]).map(t=>`<span class="tag">#${safe(t)}</span>`).join('')}</div><button class="play" data-play="${safe(g.id)}">${g.multiplayer?'Create / Join Room':'Play'}</button></div></article>`).join(''):`<div class="empty">No enabled games found. Check games.json.</div>`}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render()}const p=e.target.closest('[data-play]');if(p)openGame(p.dataset.play)});
function makeCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>c[Math.floor(Math.random()*c.length)]).join('')}
function openGame(id){selected=games.find(g=>g.id===id);if(!selected)return;if(!selected.entryUrl){alert('This game is listed but has no entryUrl. Add its HTML path to games.json.');return}if(selected.multiplayer){const q=new URLSearchParams(location.search),incoming=(q.get('room')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),code=incoming.length===6?incoming:makeCode();$('#lobbyTitle').textContent=selected.title;$('#roomCode').textContent=code;const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('game',selected.id);u.searchParams.set('room',code);$('#roomLink').value=u.href;$('#roomStatus').textContent='Share this link. The game itself owns the P2P connection.';$('#lobby').classList.remove('hidden')}else launch(selected,'')}
function launch(g,code){const u=new URL(g.entryUrl,location.href);if(g.multiplayer&&code)u.searchParams.set('room',code);$('#gameTitle').textContent=g.title;$('#frame').src=u.href;$('#game').classList.remove('hidden');$('#lobby').classList.add('hidden')}
$('#launch').onclick=()=>selected&&launch(selected,$('#roomCode').textContent);$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#roomLink').value);$('#copy').textContent='Copied';setTimeout(()=>$('#copy').textContent='Copy',1200)}catch{$('#roomLink').select()}};$('#refresh').onclick=load;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{const id=b.dataset.close;$('#'+id).classList.add('hidden');if(id==='game')$('#frame').src='about:blank'});window.addEventListener('message',e=>{if(e.data?.type==='phonix:exit'){$('#game').classList.add('hidden');$('#frame').src='about:blank'}if(e.data?.type==='phonix:title')$('#gameTitle').textContent=e.data.title});window.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden'));$('#frame').src='about:blank'}});
const q=new URLSearchParams(location.search);load().then(()=>{const g=games.find(x=>x.id===q.get('game'));if(g&&q.get('room'))launch(g,q.get('room').toUpperCase())});
</script></body></html>
